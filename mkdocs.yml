site_name: Learning Notes
site_description: Computer Science Learning Notes
site_url: https://handwan.github.io/learning-notes/
repo_url: https://github.com/handwan/learning-notes
repo_name: learning-notes
copyright: © 2026 han

theme:
  name: material
  language: zh
  font: false
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: white
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: black
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.path
    - navigation.instant
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang:
        - en
        - zh
      pipeline: []      # 关掉词干化：lunr 对带 * 的查询词不跑词干化，索引却存词干化后的词，导致 using 这类词搜不到
  - awesome-pages

hooks:
  - hooks/fix_lunr_search.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/handwan

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/random.js
